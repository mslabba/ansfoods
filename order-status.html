<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>ANS Foods — Order status</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/site.css" />
<style>
  .status-main { min-height: calc(100vh - 160px); display: flex; align-items: center; justify-content: center; padding: 28px 18px 40px; }
  .card { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; padding: 32px 26px; max-width: 460px; width: 100%; text-align: center; }
  .status-logo { width: 140px; height: auto; margin: 0 auto 14px; display: block; }
  .mark { font-size: 44px; margin-bottom: 8px; color: var(--forest); }
  .card h1 { font-family: var(--serif); font-size: 24px; margin: 0 0 8px; color: var(--ink); }
  .card p { color: var(--muted); font-size: 14px; margin: 6px 0; }
  .oid strong { color: var(--ink); letter-spacing: .5px; }
  .status-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
  .status-btn { display: inline-block; padding: 12px 20px; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: 14px; border: 1px solid var(--line); color: var(--ink); background: transparent; }
  .status-btn.primary { background: var(--forest-deep); color: var(--on-green); border-color: var(--forest-deep); }
  .status-btn.wa { background: #1f7a3d; color: #fff; border-color: #1f7a3d; }
  .spin { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--forest); border-radius: 50%; margin: 0 auto 12px; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (max-width: 560px) { .utility .origin { display: none; } .utility { justify-content: flex-end; } }
</style>
</head>
<body>
  <header class="utility" aria-label="Site navigation">
    <a class="origin" href="/"><span data-en>ANS Foods · Made in Kerala</span><span data-ml lang="ml">ANS Foods · കേരളത്തിൽ നിർമ്മിച്ചത്</span></a>
    <div class="utility-actions">
      <a class="nav-link" href="/"><span data-en>Home</span><span data-ml lang="ml">ഹോം</span></a>
      <a class="nav-link" href="/shop"><span data-en>Shop</span><span data-ml lang="ml">ഷോപ്പ്</span></a>
      <div class="lang-switch" aria-label="Language">
        <button class="lang-btn" type="button" data-lang="en" aria-pressed="true">EN</button>
        <button class="lang-btn" type="button" data-lang="ml" aria-pressed="false">മലയാളം</button>
      </div>
      <a class="cart-trigger" href="/#cart" aria-label="Open cart">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 4h2l2.2 9.2a2 2 0 0 0 2 1.5h7.7a2 2 0 0 0 1.9-1.4L21 7H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19" r="1.3" fill="currentColor"/><circle cx="17.5" cy="19" r="1.3" fill="currentColor"/></svg>
        <span class="cart-count" aria-live="polite">0</span>
      </a>
    </div>
  </header>
<main class="status-main">
<div class="card">
  <a href="/"><img class="status-logo" src="assets/logo.png" alt="ANS Foods — home" width="300" height="155" /></a>
  <div id="icon"><div class="spin"></div></div>
  <h1 id="title">Checking your payment…</h1>
  <p class="oid"><span id="oidLabel">Order ID</span>: <strong id="oid">–</strong></p>
  <p id="desc">Please wait while we confirm your payment with the bank.</p>
  <div class="status-actions">
    <a class="status-btn wa" id="waBtn" href="https://wa.me/919037138030" target="_blank" rel="noopener" hidden>Connect on WhatsApp</a>
    <a class="status-btn primary" id="shopBtn" href="/shop">Continue shopping</a>
    <a class="status-btn" id="homeBtn" href="/">Back to home</a>
  </div>
</div>
</main>
<script src="assets/store.js"></script>
<script>
(function(){
  'use strict';
  var q = new URLSearchParams(location.search);
  var orderId = q.get('order_id') || '';
  document.getElementById('oid').textContent = orderId || '–';
  var lang = ANS.applyLang();
  ANS.ui.syncCartBadge(ANS.cart.count(ANS.cart.load()));
  var T = {
    checking: { en:'Checking your payment…', ml:'പേയ്‌മെന്റ് പരിശോധിക്കുന്നു…' },
    wait: { en:'Please wait while we confirm your payment with the bank.', ml:'ബാങ്കുമായി പേയ്‌മെന്റ് സ്ഥിരീകരിക്കുന്നത് വരെ കാത്തിരിക്കൂ.' },
    paid: { en:'Payment successful — order placed!', ml:'പേയ്‌മെന്റ് വിജയകരം — ഓർഡർ നൽകി!' },
    paidDesc: { en:'Thank you! ANS Foods will confirm shipping and delivery time on WhatsApp.', ml:'നന്ദി! ഷിപ്പിംഗും ഡെലിവറി സമയവും ANS Foods വാട്ട്‌സ്ആപ്പിൽ സ്ഥിരീകരിക്കും.' },
    pending: { en:'Payment is still processing.', ml:'പേയ്‌മെന്റ് ഇപ്പോഴും പ്രോസസ്സ് ചെയ്യുന്നു.' },
    pendingDesc: { en:'If money was debited, it will reflect shortly. You can also check back in a few minutes.', ml:'പണം ഡെബിറ്റ് ആയിട്ടുണ്ടെങ്കിൽ ഉടൻ തെളിയും. കുറച്ച് കഴിഞ്ഞ് വീണ്ടും പരിശോധിക്കാം.' },
    failed: { en:'Payment did not go through.', ml:'പേയ്‌മെന്റ് പൂർത്തിയായില്ല.' },
    failedDesc: { en:'No money was charged. Please try again from the store.', ml:'പണം ഈടാക്കിയിട്ടില്ല. സ്റ്റോറിൽ നിന്ന് വീണ്ടും ശ്രമിക്കുക.' },
    missing: { en:'No order found.', ml:'ഓർഡർ കണ്ടെത്തിയില്ല.' },
    oid: { en:'Order ID', ml:'ഓർഡർ ഐഡി' },
    shop: { en:'Continue shopping', ml:'ഷോപ്പിംഗ് തുടരുക' },
    retry: { en:'Back to cart', ml:'കാർട്ടിലേക്ക് മടങ്ങുക' },
    home: { en:'Back to home', ml:'ഹോമിലേക്ക് മടങ്ങുക' },
    wa: { en:'Connect on WhatsApp', ml:'വാട്ട്‌സ്ആപ്പിൽ ബന്ധപ്പെടുക' }
  };
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.addEventListener('click', function(){ lang = ANS.setLang(b.getAttribute('data-lang')); render(lastStatus); });
  });
  // Empty the cart only once the server confirms the order is paid/confirmed.
  // Failed or pending payments keep the cart so the shopper can retry.
  var cartCleared = false;
  function clearCartOnce(){
    if (cartCleared) return;
    cartCleared = true;
    ANS.cart.clear();
    ANS.ui.syncCartBadge(0);
  }
  var lastStatus = 'checking', tries = 0;
  function render(status){
    lastStatus = status;
    document.getElementById('oidLabel').textContent = T.oid[lang];
    document.getElementById('homeBtn').textContent = T.home[lang];
    var waBtn = document.getElementById('waBtn');
    waBtn.textContent = T.wa[lang];
    var shopBtn = document.getElementById('shopBtn');
    var failed = status === 'failed' || status === 'cancelled';
    shopBtn.textContent = failed ? T.retry[lang] : T.shop[lang];
    shopBtn.href = failed ? '/#cart' : '/shop';
    var icon = document.getElementById('icon'), title = document.getElementById('title'), desc = document.getElementById('desc');
    if (status === 'paid') {
      icon.innerHTML = '<div class="mark">✓</div>';
      title.textContent = T.paid[lang]; desc.textContent = T.paidDesc[lang];
      waBtn.hidden = false;
    } else if (status === 'failed' || status === 'cancelled') {
      icon.innerHTML = '<div class="mark">✕</div>';
      title.textContent = T.failed[lang]; desc.textContent = T.failedDesc[lang];
    } else if (status === 'missing') {
      icon.innerHTML = '<div class="mark">?</div>';
      title.textContent = T.missing[lang]; desc.textContent = '';
    } else if (status === 'checking') {
      title.textContent = T.checking[lang]; desc.textContent = T.wait[lang];
    } else {
      icon.innerHTML = '<div class="spin"></div>';
      title.textContent = T.pending[lang]; desc.textContent = T.pendingDesc[lang];
    }
  }
  function poll(){
    if (!orderId) { render('missing'); return; }
    fetch('/api/orders/' + encodeURIComponent(orderId))
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(r){
        if (!r.ok) { render('missing'); return; }
        var st = r.j.status;
        if (st === 'paid' || st === 'confirmed') { clearCartOnce(); render('paid'); return; }
        if (st === 'failed' || st === 'cancelled') { render('failed'); return; }
        render('pending');
        if (++tries < 40) setTimeout(poll, 3000);
      })
      .catch(function(){ if (++tries < 40) setTimeout(poll, 3000); });
  }
  render('checking');
  poll();
})();
</script>
<p style="text-align:center;font-size:12px;margin:0 0 20px"><a href="/terms" style="color:#7a6f62">Terms</a> · <a href="/privacy-policy" style="color:#7a6f62">Privacy</a> · <a href="/refund-policy" style="color:#7a6f62">Refunds</a> · <a href="/shipping-policy" style="color:#7a6f62">Shipping</a> · <a href="/contact" style="color:#7a6f62">Contact</a></p>
</body>
</html>
