services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ansfoods
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ansfoods
    volumes:
      - ansfoods_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansfoods -d ansfoods"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://ansfoods:${DB_PASSWORD}@postgres:5432/ansfoods
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      PORT: 4000
    ports:
      - "8090:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ansfoods_pg:
